# Production stack on the cloud VM: Caddy (HTTPS) -> web (image from GHCR) -> MySQL.
# Lives in ~/studenthub on the server next to .env, Caddyfile and deploy.sh.
# GitHub Actions copies this file and runs deploy.sh; you rarely edit it by hand.
#
# Only Caddy publishes ports (80/443). MySQL and the app are reachable only on the
# private Docker networks. The mysql_data volume survives every deployment.

name: studenthub

services:
  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [backend]

  web:
    image: ${IMAGE_NAME:?Set IMAGE_NAME in .env}:${IMAGE_TAG:?IMAGE_TAG is set by deploy.sh}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?}
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      TRUST_PROXY: "true"
    networks: [backend, edge]

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

volumes:
  mysql_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true   # no internet access needed for the database network
  edge:
